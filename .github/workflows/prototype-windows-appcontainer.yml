name: Prototype Windows AppContainer runner

on:
  workflow_dispatch:
  push:
    branches:
      - codex/prototype-windows-lpac-runner
    paths:
      - .github/workflows/prototype-windows-appcontainer.yml
      - prototypes/windows-appcontainer-runner/**

permissions:
  contents: read

jobs:
  boundary-matrix:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out prototype
        uses: actions/checkout@v4

      - name: Run AppContainer boundary matrix
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/run.ps1 -Mode appcontainer -KeepFixture

      - name: Run LPAC boundary matrix
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/run.ps1 -Mode lpac -KeepFixture

      - name: Minimize runtime Capability manifests
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/runtime-capability-matrix.ps1 -KeepFixture

      - name: Validate bundled Node runtime pack
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/runtime-pack-integration-test.ps1 -KeepFixture

      - name: Validate narrow Sandbox Provisioner contract
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/provisioner-integration-test.ps1 -KeepFixture

      - name: Validate Provisioner startup recovery
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/provisioner-startup-recovery-test.ps1 -KeepFixture

      - name: Run lifecycle crash recovery matrix
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/lifecycle-recovery-test.ps1 -KeepFixture

      - name: Run Desktop broker lifecycle matrix
        shell: pwsh
        run: pwsh -File prototypes/windows-appcontainer-runner/desktop-broker-integration-test.ps1 -KeepFixture

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopeguard-appcontainer-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\result.json
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\policy-parity.json
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\lifecycle-ledger.json
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\cleanup-result.json
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\workspace\boundary-result.json
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\workspace\launcher-diagnostics.log
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\workspace\launcher-diagnostics.log.child-output.log
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\workspace\*-result.json
            ${{ runner.temp }}\scopeguard-appcontainer-fixture\workspace\cmd-result.txt
            ${{ runner.temp }}\scopeguard-lpac-fixture\result.json
            ${{ runner.temp }}\scopeguard-lpac-fixture\policy-parity.json
            ${{ runner.temp }}\scopeguard-lpac-fixture\lifecycle-ledger.json
            ${{ runner.temp }}\scopeguard-lpac-fixture\cleanup-result.json
            ${{ runner.temp }}\scopeguard-lpac-fixture\workspace\boundary-result.json
            ${{ runner.temp }}\scopeguard-lpac-fixture\workspace\launcher-diagnostics.log
            ${{ runner.temp }}\scopeguard-lpac-fixture\workspace\launcher-diagnostics.log.child-output.log
            ${{ runner.temp }}\scopeguard-lpac-fixture\workspace\*-result.json
            ${{ runner.temp }}\scopeguard-lpac-fixture\workspace\cmd-result.txt
            ${{ runner.temp }}\scopeguard-runtime-capability-fixture\result.json
            ${{ runner.temp }}\scopeguard-runtime-capability-fixture\lifecycle-ledger.json
            ${{ runner.temp }}\scopeguard-runtime-capability-fixture\cleanup-result.json
            ${{ runner.temp }}\scopeguard-runtime-capability-fixture\diagnostics\*.log
            ${{ runner.temp }}\scopeguard-runtime-pack-fixture\result.json
            ${{ runner.temp }}\scopeguard-runtime-pack-fixture\lifecycle-ledger.json
            ${{ runner.temp }}\scopeguard-runtime-pack-fixture\cleanup-result.json
            ${{ runner.temp }}\scopeguard-runtime-pack-fixture\metadata\*.json
            ${{ runner.temp }}\scopeguard-runtime-pack-fixture\diagnostics\*.log
            ${{ runner.temp }}\scopeguard-provisioner-fixture\result.json
            ${{ runner.temp }}\scopeguard-provisioner-fixture\state\*\lifecycle-ledger.json
            ${{ runner.temp }}\scopeguard-provisioner-fixture\launcher-diagnostics.log
            ${{ runner.temp }}\scopeguard-provisioner-fixture\launcher-diagnostics.log.child-output.log
            ${{ runner.temp }}\scopeguard-provisioner-recovery-fixture\result.json
            ${{ runner.temp }}\scopeguard-provisioner-recovery-fixture\*-ready.json
            ${{ runner.temp }}\scopeguard-provisioner-recovery-fixture\state\*\lifecycle-ledger.json
            ${{ runner.temp }}\scopeguard-provisioner-recovery-fixture\state\*\recovery-tombstone.json
            ${{ runner.temp }}\scopeguard-lifecycle-recovery-fixture\result.json
            ${{ runner.temp }}\scopeguard-lifecycle-recovery-fixture\lifecycle-ledger.json
            ${{ runner.temp }}\scopeguard-lifecycle-recovery-fixture\recovery-*.json
            ${{ runner.temp }}\scopeguard-desktop-broker-fixture\result.json
            ${{ runner.temp }}\scopeguard-desktop-broker-fixture\desktop-parent-ready.json
            ${{ runner.temp }}\scopeguard-desktop-broker-fixture\desktop-host-ready.json
            ${{ runner.temp }}\scopeguard-desktop-broker-fixture\lifecycle-*.json
            ${{ runner.temp }}\scopeguard-desktop-broker-fixture\workspace-*\conversation-result.json
            ${{ runner.temp }}\scopeguard-desktop-broker-fixture\workspace-*\launcher-diagnostics.log
