name: Windows Desktop Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-desktop-package.yml"
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - "codex/windows-package-slice"
    paths:
      - ".github/workflows/windows-desktop-package.yml"
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - uses: actions/upload-artifact@v4
        with:
          name: scopeguard-windows-installer
          path: apps/desktop/release/ScopeGuard-*-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: scopeguard-windows-unpacked
          path: apps/desktop/release/win-unpacked
          if-no-files-found: error
          retention-days: 7
